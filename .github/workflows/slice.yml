name: Slice

on:
  push:
  pull_request:

jobs:
  slice:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate plates
        run: |
          pip install build123d
          python generate_plates.py
      - uses: estampo/estampo/action@v0
        with:
          config: estampo.toml
